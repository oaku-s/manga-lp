<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>飲食店 集客マンガLP</title>
    <link rel="stylesheet" href="css/manga.css" />
  </head>
  <body>
    <main class="lp">
      <section class="scene scene--p1 js-fade-panel">
        <div class="scene__visual" aria-hidden="true"></div>
        <div class="scene__content">
          <p class="scene__eyebrow">コマ1</p>
          <h2 class="scene__title">売れない...</h2>
        </div>
      </section>

      <section class="scene scene--p2 js-fade-panel">
        <div class="scene__visual" aria-hidden="true"></div>
        <div class="scene__content">
          <p class="scene__eyebrow">コマ2</p>
          <h2 class="scene__title">これだ！</h2>
        </div>
      </section>

      <section class="scene scene--p3 js-fade-panel">
        <div class="scene__visual" aria-hidden="true"></div>
        <div class="scene__content">
          <p class="scene__eyebrow">コマ3</p>
          <h2 class="scene__title">満員！</h2>
        </div>
      </section>

      <section class="scene scene--p4 js-fade-panel">
        <div class="scene__visual" aria-hidden="true"></div>
        <div class="scene__content">
          <p class="scene__eyebrow">コマ4</p>
          <h2 class="scene__title">大成功！</h2>
        </div>
      </section>

      <section id="contact" class="scene scene--cta js-fade-panel">
        <div class="scene__content">
          <p class="scene__eyebrow">まずはお気軽に</p>
          <h2 class="scene__title">今すぐ無料相談する</h2>
          <a class="scene__cta" href="#">今すぐ無料相談する</a>
        </div>
      </section>
    </main>

    <a class="fixed-cta" href="#contact">今すぐ無料相談する</a>

    <script src="js/scroll.js"></script>
  </body>
</html>
